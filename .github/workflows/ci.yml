name: CI

# The repository had no workflow at all until 2026-09-24: 84 pytest cases that nothing ran.
# MEASURED before writing this: `python3 -m pytest tests -q` -> 84 passed in 5.23s.
#
# Actions are pinned to a COMMIT SHA, not a tag. A tag is mutable and a supply-chain step that
# resolves differently tomorrow is not a step anyone reviewed. Each SHA below was verified against
# the upstream API at pin time, with the release tag it belongs to in the trailing comment.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.10". The floor is tested because that is
        # the version the declaration promises, not only the one that happens to be current.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (the single runtime dependency, plus pytest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=41" pytest
      - name: pytest
        run: python -m pytest tests -q
